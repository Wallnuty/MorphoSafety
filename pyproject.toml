[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mjx-safety-gym"
version = "0.1.6"
description = "MJX Safety Gym Environments"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [
  { name = "Sam Snyman" }
]
dependencies = [
  "absl-py>=2.2.2,<3.0.0",
  "etils==1.13.0",
  "flax==0.10.6",
  "jax==0.10.2",
  "ml_collections==1.1.0",
  "mujoco==3.3.2",
  "mujoco_mjx==3.3.2",
  "numpy==2.3.2",
  "pynput==1.8.1",
  "setuptools>=68.0.0",
  # NOTE: the CUDA plugin must stay in lockstep with the jax pin above --
  # a mismatched jax-cuda12-plugin fails hard at import with a PJRT version
  # error. Install it via the [cuda] extra rather than by hand; on a headless
  # cluster node a missing plugin does NOT fail, it silently falls back to CPU.
  # jax 0.6.0 was measured ~2.4x slower at MJX stepping, hence the exact pin.
  "optax>=0.2.4",
  # Pinned to commit, not branch: both of these track moving branches upstream
  # (and `playground` had no ref at all, so it followed the default branch),
  # which quietly breaks reproducibility the moment the fork advances. These
  # SHAs are what the working environment was built from.
  "brax @ git+https://github.com/Andrew-Luo1/brax.git@aeda2a4269fa05fe17d3e678f15f11e7d01323a7",
  "playground @ git+https://github.com/Andrew-Luo1/mujoco_playground_new.git@179d98010a8320b42048be53bddac6b678e842b8",
]

[project.optional-dependencies]
# `pip install .[cuda]` on a GPU node. Kept as an extra so CPU-only installs
# (laptop debugging, CI) don't drag in ~3 GB of NVIDIA wheels. The plugin
# bundles its own CUDA 12 runtime via nvidia-*-cu12 wheels, so it does not
# depend on which `module load cuda-*` is active -- only on the host driver.
cuda = ["jax[cuda12]==0.10.2"]
# scripts/evolve.py + scripts/fitness_noise.py (NSGA-II morphology search).
# Separate extra: irrelevant to anyone just training/replaying a fixed body.
evolve = ["pymoo==0.6.2"]
# `pip install -e .[dev] && pytest`. The suite runs on the CPU backend (see
# tests/conftest.py) so it does not contend with a training run for the GPU.
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Wallnuty/MorphoSafety"
Upstream = "https://github.com/mvdhart/mjx-safety-gym"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mjx_safety_gym*"]

[tool.setuptools.package-data]
"mjx_safety_gym.envs" = ["xmls/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra so the reasons for skips/xfails are visible; these tests encode
# measurements, and a silently skipped one is worse than a missing one.
addopts = "-ra"
markers = [
    "slow: builds an ant env and compiles ant physics (tens of seconds on CPU)",
]
filterwarnings = [
    # mujoco-mjx 3.3.2 casts float64 max to float32 in
    # collision_convex._box_box, which warns on literally every reset.
    # Upstream and harmless, but loud enough to bury real warnings.
    "ignore:overflow encountered in cast:RuntimeWarning",
    "ignore:JAXopt is no longer maintained:DeprecationWarning",
]